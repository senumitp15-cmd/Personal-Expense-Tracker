<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">Personal Expense Tracker</div>
    </nav>

    <main class="container">
        <header class="header">
            <h1>Financial Dashboard</h1>
            <p>Manage your income and expenses in one place.</p>
        </header>

        <!-- 2. Summary Cards -->
        <section class="summary-cards">
            <div class="card card-income">
                <span class="card-label">Total Income</span>
                <div class="card-amount" id="total-income">LKR 0.00</div>
            </div>
            <div class="card card-expense">
                <span class="card-label">Total Expenses</span>
                <div class="card-amount" id="total-expense">LKR 0.00</div>
            </div>
            <div class="card card-balance">
                <span class="card-label">Current Balance</span>
                <div class="card-amount" id="current-balance">LKR 0.00</div>
            </div>
        </section>

        <!-- 3. Transaction Form -->
        <section class="form-section">
            <h2>Add a Transaction</h2>
            <form id="transaction-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Monthly allowance" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (LKR)</label>
                        <input type="number" id="amount" step="0.01" min="0.01" placeholder="Enter amount" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Allowance">Allowance</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Transaction Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                    <button type="button" id="clear-form-btn" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </section>

        <!-- 4 & 5. Transaction History, Search, and Filter -->
        <section class="history-section">
            <h2>Transaction History</h2>
            <div class="controls-grid">
                <div class="control-group">
                    <label for="filter-type">Filter by Type</label>
                    <select id="filter-type">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expense Only</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="search-input">Search Transactions</label>
                    <input type="text" id="search-input" placeholder="Search by description or category">
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th>Amount (LKR)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list">
                        <!-- Dynamic rows rendered via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
